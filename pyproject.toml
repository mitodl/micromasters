[project]
name = "micromasters"
version = "0.0.1"
requires-python = ">=3.11"
dependencies = [
    "django>=5.2,<5.3",
    "pillow>=10.0",
    "boto3==1.42.78",
    "celery==5.6.3",
    "certifi>=2021.10.8",
    "dj-database-url==0.3.0",
    "django-cors-headers>=4.0",
    "django-hijack>=3.3,<4.0",
    "django-ipware>=5.0",
    "django-health-check[celery,redis]>=4.0.0",
    "django-redis==5.2.0",
    "django-robots>=5.0",
    "django-role-permissions==2.2.1",
    "django-storages>=1.13",
    "django-webpack-loader==1.7.0",
    "djangorestframework>=3.14",
    "edx-api-client==1.2.0",
    "edx-opaque-keys==0.4.4",
    "opensearch-py==1.0.0",
    "opensearch-dsl==1.0.0",
    "factory-boy==2.8.1",
    "faker",
    "html5lib>=1.1",
    "l18n==2021.3",
    "ipython",
    "jsonfield>=3.1.0",
    "jsonpatch==1.16",
    "pyjwt==2.13.0",
    "phonenumbers>=8.12.0",
    "psycopg2>=2.9",
    "pycountry",
    "python-dateutil>=2.8.2",
    "sentry-sdk==1.1.0",
    "redis>=4.0",
    "requests>=2.20.0",
    "setuptools>=67.6.1,<80",
    "six>=1.11.0",
    "robohash==2.0.0",
    "tornado>=6.0",
    "urllib3==1.26.5",
    "wagtail>=7.0,<8.0",
    "flaky==3.7.0",
    "pyopenssl",
    "social-auth-core>=4.0,<5.0",
    "social-auth-app-django>=5.0,<6.0",
    "django-taggit>=5.0",
    "django-filter>=23.0",
    "willow[heif]>=1.8",
    "sqlparse>=0.5",
    "granian>=2.7.2",
    "celery-redbeat>=2.3.3",
]

[tool.uv]
package = false
exclude-newer = "7d"

[tool.uv.exclude-newer-package]
ol-concourse = "0d"
django-aqueduct = "0d"
edx-sysadmin = "0d"
edx-username-changer = "0d"
ol-openedx-ai-static-translations = "0d"
ol-openedx-auto-select-language = "0d"
ol-openedx-canvas-integration = "0d"
ol-openedx-chat = "0d"
ol-openedx-chat-xblock = "0d"
ol-openedx-checkout-external = "0d"
ol-openedx-course-export = "0d"
ol-openedx-course-outline-api = "0d"
ol-openedx-course-structure-api = "0d"
ol-openedx-course-sync = "0d"
ol-openedx-course-translations = "0d"
ol-openedx-events-handler = "0d"
ol-openedx-feedback = "0d"
ol-openedx-git-auto-export = "0d"
ol-openedx-logging = "0d"
ol-openedx-lti-utilities = "0d"
ol-openedx-otel-monitoring = "0d"
ol-openedx-rapid-response-reports = "0d"
ol-openedx-sentry = "0d"
ol-openedx-uai-content-customization = "0d"
ol-social-auth = "0d"
openedx-companion-auth = "0d"
rapid-response-xblock = "0d"
mitol-django-common = "0d"
mitol-django-mail = "0d"
mitol-django-authentication = "0d"
mitol-django-digitalcredentials = "0d"
mitol-django-geoip = "0d"
mitol-django-google-sheets = "0d"
mitol-django-google-sheets-deferrals = "0d"
mitol-django-google-sheets-refunds = "0d"
mitol-django-hubspot-api = "0d"
mitol-django-oauth-toolkit-extensions = "0d"
mitol-django-olposthog = "0d"
mitol-django-openedx = "0d"
mitol-django-payment-gateway = "0d"
mitol-django-transcoding = "0d"
mitol-django-apigateway = "0d"
mitol-django-observability = "0d"
mitol-django-scim = "0d"
mitol-drf-lint = "0d"

[dependency-groups]
dev = [
    "astroid>=3.0,<4.0",
    "ddt",
    "django-debug-toolbar",
    "ipdb",
    "nplusone>=0.8.1",
    "pylint>=3.0,<4.0",
    "pylint-django>=2.5,<3.0",
    "pylint-plugin-utils>=0.8",
    "pytest>=7.0,<8.0",
    "pytest-cov==2.12.1",
    "pytest-django==4.12.0",
    "pytest-mock==3.15.1",
    "selenium",
    "testfixtures",
    "isort",
    "semantic-version",
]

[tool.bumpversion]
current_version = "0.250.1"
commit = false
tag = false
parse = "(?P<release>(?:[1-9][0-9]{3})\\.(?:1[0-2]|[1-9])\\.(?:3[0-1]|[12][0-9]|[1-9]))\\.(?P<build>\\d+)"
serialize = ["{release}.{build}"]

[tool.bumpversion.parts.release]
calver_format = "{YYYY}.{MM}.{DD}"

[tool.bumpversion.parts.build]
first_value = "1"

[[tool.bumpversion.files]]
filename = "VERSION"
search = "{current_version}"
replace = "{new_version}"

[[tool.bumpversion.files]]
filename = "pyproject.toml"
search = 'version = "{current_version}"'
replace = 'version = "{new_version}"'

[[tool.bumpversion.files]]
filename = "uv.lock"
search = """
name = "micromasters"
version = "{current_version}"
source = {{ virtual = "." }}"""
replace = """
name = "micromasters"
version = "{new_version}"
source = {{ virtual = "." }}"""
